name: Build PoolPathPro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar app-debug.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar Gradle Wrapper (se ausente)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PoolPathPro-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK na aba Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PoolPathPro-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PoolPathPro-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PoolPathPro (build mais recente)" \
            --notes "APK de debug gerado automaticamente do commit ${GITHUB_SHA::7}."
